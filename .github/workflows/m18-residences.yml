name: m18-residences e2e

on:
  workflow_dispatch:
    inputs:
      server_ref: { description: m18-residences-server ref, default: main }
      admin_ref: { description: M18-Residences-Admin ref, default: main }
      tenant_ref: { description: M18-Residences ref, default: main }
      shared_ref: { description: shared-packages ref (ignored when pinned), default: main }
      pinned: { description: 'Use the m18_residences_shared tag each app pins (what deploys ship)', type: boolean, default: false }
      e2e_ref: { description: shared-e2e ref (the specs), default: main }
  workflow_call:
    inputs:
      server_ref: { type: string, default: main }
      admin_ref: { type: string, default: main }
      tenant_ref: { type: string, default: main }
      shared_ref: { type: string, default: main }
      pinned: { type: boolean, default: false }
      e2e_ref: { type: string, default: main }

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Sibling checkouts, the layout env.mjs expects (<workspace>/<repo>).
      - uses: actions/checkout@v7
        with: { repository: whatever413y/shared-e2e, ref: '${{ inputs.e2e_ref }}', path: shared-e2e }
      - uses: actions/checkout@v7
        with: { repository: whatever413y/m18-residences-server, ref: '${{ inputs.server_ref }}', path: m18-residences-server }
      - uses: actions/checkout@v7
        with: { repository: whatever413y/M18-Residences-Admin, ref: '${{ inputs.admin_ref }}', path: M18-Residences-Admin }
      - uses: actions/checkout@v7
        with: { repository: whatever413y/M18-Residences, ref: '${{ inputs.tenant_ref }}', path: M18-Residences }

      # Unpinned: both apps build against one checkout of m18_residences_shared. Pinned: each app resolves the tag
      # its pubspec.yaml names, exactly as the deploy builds do.
      - if: ${{ !inputs.pinned }}
        uses: actions/checkout@v7
        with: { repository: whatever413y/shared-packages, ref: '${{ inputs.shared_ref }}', path: shared-packages }
      - name: Point both apps at the checked-out m18_residences_shared (instead of the pinned tag)
        if: ${{ !inputs.pinned }}
        run: |
          for app in M18-Residences-Admin M18-Residences; do
            printf 'dependency_overrides:\n  m18_residences_shared:\n    path: ../shared-packages/packages/m18_residences_shared\n' > "$app/pubspec_overrides.yaml"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: m18-residences-server -> target
      - name: Install worker-build
        run: cargo install worker-build --locked --version '^0.8'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared-e2e/m18-residences/package-lock.json

      - run: npm ci
        working-directory: shared-e2e/m18-residences
      - run: npm run e2e
        working-directory: shared-e2e/m18-residences
        env:
          CI: 'true'

      - name: Which m18_residences_shared each app built against
        if: ${{ always() }}
        run: |
          for app in M18-Residences-Admin M18-Residences; do
            echo "== $app"; grep -A4 '^  m18_residences_shared:' "$app/pubspec.lock" || echo "(no lock)"
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            shared-e2e/m18-residences/playwright-report
            shared-e2e/m18-residences/test-results
